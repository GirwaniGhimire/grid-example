<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>

            <a href="#" class="logo">✕</a>

            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>

        </header>

        <div class="featured">

            <img src="images/ad.jpeg" alt="Featured Post">

            <div class="featured-text">
                <h2>Featured Post</h2>
                <p>This is a short description of the featured post.</p>
            </div>

        </div>

        <main>

            <div class="recent">

                <h2>Recent Post</h2>

                <div class="post">
                    <img src="assets/ad.jpeg" alt="Post 1">

                    <div class="post-text">
                        <h3>Post 1</h3>
                        <p>This is a short description of the post1.</p>
                    </div>
                </div>

                <div class="post">
                    <img src="assets/ad.jpeg" alt="Post 2">

                    <div class="post-text">
                        <h3>Post 2</h3>
                        <p>This is a short description of the post2.</p>
                    </div>
                </div>

            </div>

            <div class="right">

                <div class="subscribe">
                    <h3>Subscribe</h3>
                    <input type="text">
                    <button>Join</button>
                </div>

                <div class="categories">

                    <h3>Category</h3>

                    <div>
                        <button>Cat 1</button>
                        <button>Cat 2</button>
                    </div>

                    <div>
                        <button>Cat 3</button>
                        <button>Cat 4</button>
                    </div>

                </div>

            </div>

        </main>

    </div>

</body>
</html>
